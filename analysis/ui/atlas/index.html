<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eufy UI atlas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/atlas.css">
  <link rel="stylesheet" href="css/phone.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">UI atlas <span>eufy 6.1.10 · 30612</span></a>
    <input id="search" type="search" placeholder="Search screens by text, key or name" autocomplete="off" aria-label="Search screens by text, text key or file name">
    <div id="search-results" class="search-results" hidden></div>
    <label class="lang-pick"><span>Preview language</span><select id="lang" aria-label="Preview language"><option value="en">English</option></select></label>
  </header>
  <div class="shell">
    <nav id="nav" class="nav" aria-label="Sections"></nav>
    <main id="view" class="view"></main>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
